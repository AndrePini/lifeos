<style>
@font-face{font-family:'Geist';font-weight:300;font-style:normal;font-display:swap;src:url(fonts/geist-sans-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:'Geist';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/geist-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Geist';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/geist-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Geist';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/geist-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/geist-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Geist Mono';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/geist-mono-latin-500-normal.woff2) format('woff2')}
:root{
  /* layout: one-screen app — header, 4 swipeable panels (Now / Inbox / Rules / Stats), bottom tab bar. single dark theme. */
  --bg:#0A0A0A; --surface:#121212; --raise:#191919; --line:#232323; --text:#EDEDED; --dim:#8E8E8E; --faint:#4A4A4A;
  --accent:#FF5A1F; --bad:#D9534A; --good:#EDEDED;
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:#0A0A0A;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
textarea,input{-webkit-user-select:text;user-select:text}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
textarea,input,select{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font:500 11px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.dim{color:var(--dim)} .small{font-size:13px}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}

/* ---------- shell ---------- */
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 18px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:20px;height:20px}
.brand .wm{font-size:13px;letter-spacing:.16em}
.wm b{font-weight:600}.wm i{font-style:normal;font-weight:300}
.top-r{display:flex;align-items:center;gap:14px}
.clock{font:500 13px var(--f-mono);color:var(--dim)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--dim)}
.icon-btn:hover{color:var(--text);background:var(--raise)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pager{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.pager::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;min-width:0;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;padding:18px 18px 40px;-webkit-overflow-scrolling:touch}
.panel>.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding:6px 8px max(8px,env(safe-area-inset-bottom));background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font:500 10px var(--f-mono);letter-spacing:.1em;position:relative}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::after{content:"";position:absolute;top:0;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.tab .dot{position:absolute;top:4px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--accent);display:none}
.tab.has .dot{display:block}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .5s ease,transform .5s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp{display:flex;flex-direction:column;align-items:center;gap:26px}
.sp svg{width:112px;height:112px;overflow:visible}
.sp-ring{fill:none;stroke:var(--text);stroke-width:9;stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1s cubic-bezier(.65,0,.35,1) .15s forwards}
.sp-tick{fill:var(--accent);transform-origin:60px 23px;transform:scaleY(0);animation:tick .32s cubic-bezier(.2,1.4,.4,1) 1.05s forwards}
.sp-glow{fill:var(--accent);opacity:0;filter:blur(10px);animation:glow .9s ease 1.1s forwards}
.sp-word{font-size:30px;letter-spacing:.3em;margin-right:-.3em;display:flex}
.sp-word span{opacity:0;transform:translateY(8px);animation:up .5s cubic-bezier(.2,.8,.2,1) forwards}
.sp-date{font:500 11px var(--f-mono);letter-spacing:.2em;color:var(--dim);opacity:0;animation:fade .6s ease 1.55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes tick{to{transform:scaleY(1)}}
@keyframes glow{40%{opacity:.7}100%{opacity:0}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body.boot .panel>.wrap>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
body.boot .panel>.wrap>*:nth-child(1){animation-delay:.05s}
body.boot .panel>.wrap>*:nth-child(2){animation-delay:.12s}
body.boot .panel>.wrap>*:nth-child(3){animation-delay:.19s}
body.boot .panel>.wrap>*:nth-child(4){animation-delay:.26s}
body.boot .panel>.wrap>*:nth-child(n+5){animation-delay:.33s}
body.boot .top,body.boot .tabs{animation:fade .6s ease both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}

/* ---------- now ---------- */
.eyebrow{display:flex;align-items:center;gap:8px}
.eyebrow .pip{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.eyebrow .pip.off{background:var(--faint)}
.streak{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:10px}
.big{font:300 68px/0.9 var(--f-body);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.streak-meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-bottom:4px}
.banner{border:1px dashed var(--faint);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--dim)}
.banner b{color:var(--text);font-weight:500}
.status{display:flex;align-items:center;gap:10px;font-size:14px}
.status .mk{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;flex:none}
.status.ok{color:var(--text)} .status.bad{color:var(--bad)}
.status .mk svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.4}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hold-card{display:flex;align-items:center;gap:18px}
.hold{position:relative;flex:none;width:112px;height:112px;border-radius:50%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hold svg{width:100%;height:100%;overflow:visible}
.h-track{fill:none;stroke:var(--line);stroke-width:9}
.h-fill{fill:none;stroke:var(--text);stroke-width:9;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p,0)*100)}
.h-tick{fill:var(--faint);transition:fill .2s}
.hold.done .h-tick,.hold.holding .h-tick{fill:var(--accent)}
.hold-txt{position:absolute;inset:0;display:grid;place-items:center;padding-top:22px;font:500 10px var(--f-mono);letter-spacing:.14em;color:var(--dim)}
.hold.holding{transform:scale(.97)} .hold{transition:transform .15s}
.h-title{font-size:20px;font-weight:500;margin-bottom:4px}
.countdown{font:300 38px/1 var(--f-body);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.block{display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;justify-content:space-between;align-items:baseline}
.fix{border-left:2px solid var(--accent);padding:2px 0 2px 14px}
.fix p{margin:4px 0 0;font-size:16px}
.routine{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.routine li{border-bottom:1px solid var(--line)}
.routine button{width:100%;display:grid;grid-template-columns:52px 1fr 22px;align-items:center;gap:10px;padding:13px 2px;text-align:left;position:relative}
.routine button:disabled{cursor:default}
.rt{color:var(--dim);font-size:13px}
.rc{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center}
.rc svg{width:11px;height:11px;fill:none;stroke:var(--bg);stroke-width:2.6;opacity:0}
li.done .rc{background:var(--text);border-color:var(--text)} li.done .rc svg{opacity:1}
li.done .rl{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--faint)}
li.cur button::before{content:"";position:absolute;left:-18px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
li.cur .rt{color:var(--accent)}
.review label{font-size:13px;color:var(--dim);margin-top:4px}
textarea,input[type=text],input[type=time],input[type=date],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;resize:vertical;min-height:44px}
textarea:focus,input:focus,select:focus{border-color:var(--faint);outline:none}
.score{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.score button{height:40px;border-radius:8px;border:1px solid var(--line);font:500 14px var(--f-mono);color:var(--dim)}
.score button[aria-checked="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.hold-wide{position:relative;overflow:hidden;width:100%;height:54px;border-radius:12px;border:1px solid var(--faint);margin-top:6px;touch-action:none;-webkit-user-select:none;user-select:none}
.hold-wide .hw-fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--p,0));background:var(--text)}
.hold-wide .hw-text{position:relative;font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;mix-blend-mode:difference;color:#fff}
.err{color:var(--bad);font-size:13px;min-height:1em}
.closed{display:grid;gap:12px}
.closed dl{margin:0;display:grid;gap:10px}
.closed dt{font:500 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.closed dd{margin:2px 0 0}
.lock{display:inline-flex;align-items:center;gap:6px}
.lock svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8}
.verse blockquote{margin:10px 0 10px;font-size:19px;line-height:1.5;font-weight:300;text-wrap:pretty}
.verse .ref{font-size:12px;color:var(--dim);letter-spacing:.04em}
.kind{display:inline-flex;align-items:center;gap:6px}
.kind::before{content:"";width:6px;height:6px;border-radius:1px;background:var(--text)}
.kind.p::before{background:var(--accent)}
.rule-mini{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rule-mini .num{font-size:12px;color:var(--accent)}
.rule-mini span:last-child{flex:1}

/* ---------- badge ---------- */
.badge{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px 0 8px;border-radius:6px;font:600 10px var(--f-mono);letter-spacing:.16em;position:relative;overflow:hidden}
.badge svg{width:12px;height:12px}
.t0{background:linear-gradient(135deg,#565b62,#a3a9b0 48%,#4d5259 75%,#7f858c);color:#0b0c0d}
.t1{background:linear-gradient(135deg,#8a6a2f,#ecd08a 45%,#a57f38 72%,#f2dc9c);color:#1b1304}
.t2{background:linear-gradient(135deg,#9aa0a6,#f5f6f7 45%,#b7bbc0 72%,#e9eaec);color:#121314}
.t3{background:linear-gradient(135deg,#030303,#2c2c2c 45%,#090909 72%,#1e1e1e);color:#EDEDED;box-shadow:inset 0 0 0 1px #3b3b3b}
.badge-lg{display:flex;flex-direction:column;justify-content:space-between;height:150px;border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.badge-lg .bl-top{display:flex;justify-content:space-between;align-items:center;font:600 11px var(--f-mono);letter-spacing:.2em}
.badge-lg .bl-top svg{width:26px;height:26px}
.badge-lg .bl-name{font:600 26px var(--f-mono);letter-spacing:.22em}
.badge-lg .bl-sub{font:500 11px var(--f-mono);letter-spacing:.08em;opacity:.75}
.shine::after{content:"";position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-60%);animation:shine 3.5s ease-in-out 2.2s infinite}
@keyframes shine{0%{transform:translateX(-60%)}35%,100%{transform:translateX(60%)}}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--text)}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{background:var(--bg);padding:14px}
.tile .v{font:300 34px/1.1 var(--f-body);margin-top:6px;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface)}
.heat i.win{background:rgba(237,237,237,var(--a,1))}
.heat i.loss{background:rgba(217,83,74,.45)}
.heat i.open{box-shadow:inset 0 0 0 1.5px var(--accent)}
.heat i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.heat i.fut{background:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wk>div{border-top:1px solid var(--line);padding-top:8px}
.wk .v{font:400 20px var(--f-mono);margin-top:4px}
.fixes{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.fixes li{display:grid;grid-template-columns:44px 1fr;gap:10px;font-size:14px}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ladder div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ladder .badge{width:100%;justify-content:center;padding:0}
.ai-out{white-space:pre-wrap;font-size:15px;line-height:1.55}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--faint);font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--dim)}
.btn.solid{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- rules ---------- */
.rule-hero{padding:22px 0 8px}
.rule-hero .n{font:300 92px/0.9 var(--f-body);color:var(--accent);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.rule-hero h2{font-size:26px;line-height:1.2;margin:14px 0 14px;font-weight:500}
.bul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bul li{display:grid;grid-template-columns:16px 1fr;color:var(--text);font-size:16px}
.bul li::before{content:"·";color:var(--dim)}
.rlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rlist li{border-bottom:1px solid var(--line)}
.rlist details summary{list-style:none;display:grid;grid-template-columns:36px 1fr;gap:8px;padding:14px 0;cursor:pointer}
.rlist summary::-webkit-details-marker{display:none}
.rlist .bul{padding:0 0 14px 44px;font-size:14px}
.rlist .today summary .num{color:var(--accent)}

/* ---------- inbox ---------- */
.ih{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.mail{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.mail li{border-bottom:1px solid var(--line)}
.mail a{display:block;padding:12px 0;color:inherit;text-decoration:none}
.m-top{display:flex;align-items:center;gap:8px;min-width:0}
.m-from{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-sub{margin-top:3px;font-size:15px;overflow-wrap:anywhere}
.m-why{margin-top:3px;font-size:13px;color:var(--dim)}
.chip{flex:none;font:600 9.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;padding:3px 6px;border-radius:4px;border:1px solid var(--faint);color:var(--dim)}
.chip.c-school,.chip.c-deadline{border-color:var(--accent);color:var(--accent)}
.chip.c-money{border-color:var(--bad);color:var(--bad)}
.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tasks li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tasks .due{font:500 12px var(--f-mono);color:var(--dim)}
.tasks .due.late{color:var(--bad)} .tasks .due.soon{color:var(--accent)}
.tasks li.done .tt{color:var(--dim);text-decoration:line-through}
.chk{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--faint);display:grid;place-items:center}
.chk svg{width:11px;height:11px;fill:none;stroke:var(--bg);stroke-width:2.6;opacity:0}
li.done .chk{background:var(--text);border-color:var(--text)} li.done .chk svg{opacity:1}
.addtask{display:grid;grid-template-columns:1fr 138px auto;gap:8px}
@media (max-width:420px){.addtask{grid-template-columns:1fr 1fr}.addtask .btn{grid-column:1/-1}}
details.more summary{cursor:pointer;padding:6px 0}
.note{font-size:13px;color:var(--dim);margin:0}
.today{display:grid;gap:8px;width:100%;text-align:left;border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.today-l{display:grid;gap:4px;font-size:15px}
.today b{font-weight:600}
.today .bad{color:var(--bad)}
.mail li.mrow{display:grid;grid-template-columns:minmax(0,1fr) 36px;align-items:center;gap:6px}
.m-from{min-width:0;flex:1 1 auto}
.mail li.imp a{border-left:2px solid var(--accent);padding-left:10px}
.mail li.dim .m-sub{color:var(--dim)}
.m-when{margin-left:auto;flex:none;font:500 11px var(--f-mono);color:var(--dim);padding-left:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);font:500 13px var(--f-body);color:var(--dim);white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chips .n{font:500 11px var(--f-mono);margin-left:6px;opacity:.65}
.empty{font-size:14px;color:var(--dim);padding:12px 0}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-in{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:20px 18px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.field{display:grid;gap:6px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rrow{display:grid;grid-template-columns:96px 1fr 36px;gap:8px;align-items:center}
.x{width:36px;height:36px;border-radius:8px;color:var(--dim);font-size:20px}
.x:hover{background:var(--raise);color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);font:500 13px var(--f-body);padding:10px 14px;border-radius:10px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.5);animation:rise .25s ease}
.ob-mark{width:64px;height:64px}
</style>
</head>

const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const doy = (d = new Date()) => Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 1)) / 864e5);
const DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const fmtDay = k => { const d = parseKey(k); return `${DOW[d.getDay()]} ${pad(d.getDate())} ${MON[d.getMonth()]}`; };
const clone = o => JSON.parse(JSON.stringify(o ?? null));

/* ================= state + storage ================= */
const S = { settings: null, days: {}, inbox: { ai: false, tri: {} }, tasks: { items: [] }, calc: null, draft: {}, holding: false };
const LOCAL_KEY = 'lifeos.v1';
function readLocal() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}') || {}; } catch (e) { return {}; } }
function writeLocal(docs) { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(docs)); } catch (e) { } }

const Store = {
  mode: 'init', col: null, docs: {}, dirty: {}, q: {}, timers: {}, loaded: false, slow: false,
  async init() {
    let db = null, user = null, uid = null;
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
    if (false) {
      try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { }
      if (db && user) { try { uid = await user.id(); } catch (e) { } }
    }
    if (db && uid) {
      this.mode = 'db';
      this.col = db.collection('data/users/' + uid);
      this.subscribe();
    } else {
      this.mode = 'local'; this.docs = readLocal(); this.loaded = true; onData();
    }
  },
  subscribe() {
    const timer = setTimeout(() => { if (!this.loaded) { this.slow = true; onData(); } }, 10000);
    this.col.onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
      for (const id in this.dirty) next[id] = this.docs[id];
      this.docs = next;
      if (!snap.metadata.fromCache) { this.loaded = true; this.slow = false; clearTimeout(timer); }
      onData();
    }, err => {
      clearTimeout(timer); this.loaded = true; this.err = err;
      toast(err.code === 'quota_exceeded' ? 'Storage is full.' : 'Your saved data could not be reached.');
      onData();
    });
  },
  put(id, data, delay = 0) {
    this.docs[id] = data;
    if (this.mode === 'db') {
      this.dirty[id] = true;
      clearTimeout(this.timers[id]);
      this.timers[id] = setTimeout(() => {
        const body = this.docs[id];
        const prev = this.q[id] || Promise.resolve();
        const p = prev.then(() => this.col.doc(id).set(body)).catch(e => { toast(e && e.code === 'quota_exceeded' ? 'Storage is full.' : 'Not saved. Check your connection.'); });
        this.q[id] = p;
        p.then(() => { if (this.q[id] === p) delete this.dirty[id]; });
      }, delay);
    } else writeLocal(this.docs);
    onData();
  }
};

/* ================= derived logic ================= */
function effWake(k) { const s = S.settings; return (s.next && k >= s.next.from) ? s.next.wake : s.wake; }
function effWin(k) { const s = S.settings; return Number((s.next && k >= s.next.from && s.next.win) ? s.next.win : s.win) || 10; }
function phase(k = todayKey(), m = nowMin()) {
  const w = toMin(effWake(k)), W = effWin(k), rev = toMin(S.settings.rev);
  if (m < w - W) return 'pre';
  if (m <= w + W) return 'wake';
  if (m < rev) return 'day';
  return 'night';
}
function dayStatus(k, t = todayKey()) {
  const s = S.settings; if (!s || k < s.start) return 'off';
  if (k > t) return 'fut';
  const d = S.days[k] || {};
  const ok = !!(d.wake && d.wake.ok), rev = !!d.rev;
  if (ok && rev) return 'win';
  if (k < t) return 'loss';
  const ph = phase(k);
  if (!ok && (ph === 'day' || ph === 'night')) return 'loss';
  return 'open';
}
function compute() {
  const s = S.settings, t = todayKey();
  let tier = 0, streak = 0, best = 0, wins = 0, losses = 0;
  if (s) for (let k = s.start, guard = 0; k <= t && guard < 4000; k = addDays(k, 1), guard++) {
    const st = dayStatus(k, t);
    if (st === 'win') { streak++; wins++; best = Math.max(best, streak); if (tier < 3 && streak >= TIERS[tier + 1].at) tier++; }
    else if (st === 'loss') { streak = 0; losses++; tier = Math.max(0, tier - 1); }
  }
  return { tier, streak, best, wins, losses, next: tier < 3 ? TIERS[tier + 1] : null };
}
function dayKeyDoc(k) { return 'd-' + k; }
function getDay(k) { return clone(S.days[k]) || {}; }
function putDay(k, d, delay) { Store.put(dayKeyDoc(k), d, delay); }

function onData() {
  const docs = Store.docs;
  S.settings = docs.settings ? clone(docs.settings) : null;
  S.days = {};
  for (const id in docs) if (id.startsWith('d-')) S.days[id.slice(2)] = docs[id];
  S.inbox = docs.inbox ? clone(docs.inbox) : { ai: false, tri: {} };
  if (!S.inbox.tri) S.inbox.tri = {};
  S.tasks = docs.tasks ? clone(docs.tasks) : { items: [] };
  if (!Store.loaded && !S.settings) { renderAll(); return; }
  if (!S.settings) { if (!INBOX_ONLY) openOnboarding(); renderAll(); return; }
  if (S.settings.next && todayKey() >= S.settings.next.from) {
    const s = clone(S.settings); s.wake = s.next.wake; if (s.next.win) s.win = s.next.win; s.next = null;
    Store.put('settings', s); return;
  }
  if (sheetMode === 'onboarding') closeSheet();
  S.calc = compute();
  renderAll();
}

const pending = new Set();
function canRender(sel) {
  const p = $(sel); const a = document.activeElement;
  if (S.holding) return false;
  if (a && p.contains(a) && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)) return false;

}
function paint(sel, html) { if (!canRender(sel)) { pending.add(sel); return; } $(sel + ' > .wrap').innerHTML = html; pending.delete(sel); bind(sel); }

function badge(tier, big) {
  const t = TIERS[tier];
  if (!big) return `<span class="badge t${tier}">${MARK(tier === 3 ? '#FF5A1F' : 'currentColor', 'currentColor')}${t.n}</span>`;
  const c = S.calc; const nx = c.next;
  return `<div class="badge-lg t${tier} shine"><div class="bl-top"><span>LIFEOS · TIER ${tier + 1}/4</span>${MARK(tier === 3 ? '#FF5A1F' : 'currentColor', 'currentColor')}</div>
    <div><div class="bl-name">${t.n}</div><div class="bl-sub">${nx ? `${c.streak}/${nx.at} DAYS TO ${nx.n}` : 'TOP TIER · HOLD IT'}</div></div></div>`;
}

function loadingHTML() {
  if (Store.loaded && !S.settings) return `<div class="card"><div class="label">Inbox mode</div><p class="dim" style="margin:8px 0 0">This is your LIFEOS Gmail inbox. Your routine, review and streak live in the LIFEOS app on your home screen.</p></div>`;
  return `<div class="card"><div class="label">Loading</div><p class="dim" style="margin:8px 0 0">${Store.slow ? "Can't reach your saved data yet. Check your connection; LIFEOS keeps trying." : 'Opening your data…'}</p></div>`;

function renderNow() {
  const sel = '#p-now';

  const avg7 = scores7.length ? (scores7.reduce((a, b) => a + b, 0) / scores7.length).toFixed(1) : '–';

    const k = addDays(start, i); const stt = dayStatus(k, t); const d = S.days[k];

  // this week
  let wakeOk = 0, revs = 0, rDone = 0, rTot = 0, sc = []; const fixes = [];
  for (let i = 0; i <= dow; i++) {
    const k = addDays(mon, i); const d = S.days[k] || {};

    if (k >= s.start || d.done) { rTot += s.routine.length; rDone += s.routine.filter(r => d.done && d.done[r.id]).length; }
  }
  const n = dow + 1;
  h += `<section class="block"><span class="label">This week</span><div class="wk">
    <div><div class="label">Wake</div><div class="v">${wakeOk}/${n}</div></div><div><div class="label">Reviews</div><div class="v">${revs}/${n}</div></div>
    <div><div class="label">Score</div><div class="v">${sc.length ? (sc.reduce((a, b) => a + b, 0) / sc.length).toFixed(1) : '–'}</div></div><div><div class="label">Routine</div><div class="v">${rTot ? Math.round(rDone / rTot * 100) + '%' : '–'}</div></div></div>
    ${fixes.length ? `<ul class="fixes">${fixes.map(([k, f]) => `<li><span class="label">${fmtDay(k).slice(0, 3)}</span><span>${esc(f)}</span></li>`).join('')}</ul>` : '<p class="note">Fixes from this week\'s reviews show up here.</p>'}
    <div id="ai-week"></div></section>`;
  h += `<section class="block"><span class="label">Tiers</span><div class="ladder">${TIERS.map((x, i) => `<div>${badge(i)}<span class="label">${x.at ? x.at + ' days' : 'start'}</span></div>`).join('')}</div>
    <p class="note">A day is won when you check in on time and lock the review. Streak hits the number → you move up. Lose a day → streak resets to 0 and you drop one tier.</p></section>`;
  paint(sel, h);
  renderAiWeek();
}

const G = { mcp: null, sample: null, by: { q1: [], q2: [] }, list: [], state: 'init', err: null, at: 0, tri: { busy: false, err: null }, week: { busy: false, text: '', err: '' } };
const Q1 = { query: 'in:inbox newer_than:4d -category:promotions -category:social -category:forums', pageSize: 40 };
const Q2 = { query: '(toddle OR assignment OR homework OR deadline OR exam OR teacher OR "due date") newer_than:21d -category:promotions -category:social', pageSize: 20 };
const CAT = { school: 'School', deadline: 'Deadline', apps: 'Uni apps', money: 'Money', people: 'People', account: 'Account', updates: 'Updates', promo: 'Promo', other: 'Other' };
const CLS = { cs: 'CS', econ: 'Econ', math: 'Math', english: 'English', portuguese: 'Portuguese', core: 'TOK/EE/CAS' };
const AUTHZ = ['needs_reauth', 'server_not_connected', 'selection_required', 'server_not_found', 'blocked_by_policy', 'not_in_manifest', 'not_granted', 'capability_disabled', 'capability_removed'];

function parseThreads(p) {
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { return []; } }
  const arr = (p && p.threads) || [];
  return arr.map(th => {
    const ms = th.messages || []; const last = ms[ms.length - 1] || {}; const first = ms[0] || {};
    return {
      id: th.id, subject: last.subject || first.subject || '(no subject)', from: last.sender || first.sender || '',
      snippet: last.snippet || first.snippet || '', labels: last.labelIds || first.labelIds || [], date: last.date || '',
      url: th.viewUrl || last.viewUrl || `https://mail.google.com/mail/u/0/#all/${th.id}`, count: th.messageCount || ms.length
    };
  }).filter(x => x.id);
}
function mergeThreads() {
  const seen = new Set(); G.list = [];
  for (const x of [...G.by.q1, ...G.by.q2]) if (!seen.has(x.id)) { seen.add(x.id); G.list.push(x); }
}
function nameOf(from) { const m = /^\s*"?([^"<]+?)"?\s*<([^>]+)>/.exec(from); if (m) return m[1]; const e = /([^@\s]+)@([^>\s]+)/.exec(from); return e ? `${e[1]} · ${e[2]}` : from; }
function heur(x) {
  const s = (x.subject + ' ' + x.from + ' ' + x.snippet).toLowerCase();
  const school = /toddle|assignment|homework|teacher|exam|class|school|ib\b|coursework/.test(s);
  const dl = /deadline|due|register by|closes|last day|final reminder/.test(s);
  const money = /payment.*(fail|unsuccess|declin)|invoice overdue/.test(s);
  const imp = school || dl || money || (x.labels || []).includes('IMPORTANT');
  return { imp, cat: school ? 'school' : dl ? 'deadline' : money ? 'money' : 'other', why: '', task: null, h: true };
}
function triOf(x) { return S.inbox.tri[x.id] || heur(x); }

async function initGmail() {
  if (!(window.claude && window.claude.use)) { G.state = 'none'; renderInbox(); return; }
  try { [G.mcp, G.sample] = await Promise.all([window.claude.use('mcp'), window.claude.use('sample')]); } catch (e) { }
  if (!G.mcp) { G.state = 'none'; renderInbox(); renderAiWeek(); return; }
  G.state = 'loading'; renderInbox(); renderAiWeek();
  watch('q1', Q1); watch('q2', Q2);
}
function watch(name, input) {
  G.mcp.watchTool('Gmail', 'search_threads', input, ev => {
    if (ev.type === 'data') {
      G.by[name] = parseThreads(ev.result.payload);
      G.at = (ev.result.cache && ev.result.cache.storedAt) || Date.now();
      G.state = 'ok'; G.err = null; mergeThreads();
    } else gErr(ev.error);
    renderInbox(); flagTab(); maybeTriage();
  }, { cache: { staleTime: 300000, gcTime: 3600000 }, refetchInterval: 600000 });
}
function gErr(e) {
  const code = (e && e.code) || 'upstream_error';
  if (code === 'approval_required') { G.state = 'approval'; G.err = e; return; }
  if (AUTHZ.includes(code)) { G.by = { q1: [], q2: [] }; G.list = []; G.state = 'denied'; G.err = e; return; }
  G.err = e; if (G.state !== 'ok') G.state = 'error';
}
async function gAllow() {
  try { const r = await G.mcp.callTool('Gmail', 'search_threads', Q1); G.by.q1 = parseThreads(r.payload); G.at = Date.now(); G.state = 'ok'; G.err = null; mergeThreads(); }
  catch (e) { gErr(e); }
  renderInbox(); maybeTriage();
}

async function maybeTriage(force) {
  if (!G.sample || !S.inbox.ai || G.tri.busy || !Store.loaded) return;
  if (!force && !inboxVisible()) return;
  const todo = G.list.filter(x => !S.inbox.tri[x.id]).slice(0, 40);
  if (!todo.length) return;
  if (!force && G.tri.failed) return;
  G.tri.busy = true; G.tri.err = null; renderInbox();
  const prompt = `You triage email for a high-school IB Diploma student (Year 2) who is applying to US universities. Today is ${todayKey()}.
For each email decide if it needs his attention.
Important: school, teachers, Toddle, assignments, exams, grades; university admissions, applications, test registration deadlines; failed payments or account problems; personal messages from real people; anything with a near deadline.
Not important: newsletters, marketing, promotions, routine receipts, social notifications, automated alerts, old login codes.
Reply with only a JSON array, one object per email, same order:
{"id": string, "imp": boolean, "cat": "school"|"deadline"|"apps"|"money"|"people"|"account"|"other", "why": string (max 8 words, plain), "task": null or {"t": string (short title), "due": "YYYY-MM-DD" or null}}
Set "task" only for a school assignment, exam, or deadline he must act on.
Emails:
${JSON.stringify(todo.map(x => ({ id: x.id, from: x.from, subject: x.subject, snippet: (x.snippet || '').slice(0, 200) })))}`;
  try {
    const out = await G.sample.json(prompt, { modelTier: 'quick' });
    const arr = Array.isArray(out) ? out : [];
    const inbox = clone(S.inbox); const tasks = clone(S.tasks); let added = 0;
    for (const r of arr) {
      if (!r || typeof r.id !== 'string' || !todo.find(x => x.id === r.id)) continue;
      const cat = CAT[r.cat] ? r.cat : 'other';
      const task = r.task && typeof r.task.t === 'string' ? { t: r.task.t.slice(0, 120), due: /^\d{4}-\d{2}-\d{2}$/.test(r.task.due || '') ? r.task.due : null } : null;
      inbox.tri[r.id] = { imp: !!r.imp, cat, why: String(r.why || '').slice(0, 80), task };
      if (task && !tasks.items.find(i => i.src === r.id)) { tasks.items.push({ id: 't' + Date.now().toString(36) + added, t: task.t, due: task.due, src: r.id, done: false }); added++; }
    }
    for (const x of todo) if (!inbox.tri[x.id]) { const hh = heur(x); inbox.tri[x.id] = { imp: hh.imp, cat: hh.cat, why: '', task: null }; }
    const ids = Object.keys(inbox.tri); if (ids.length > 300) ids.slice(0, ids.length - 300).forEach(id => delete inbox.tri[id]);
    Store.put('inbox', inbox);
    if (added) { Store.put('tasks', tasks); toast(`${added} assignment${added > 1 ? 's' : ''} added from email`); }
  } catch (e) {
    G.tri.failed = true;
    G.tri.err = e && e.code === 'not_granted' ? 'AI triage was not allowed. Basic rules are used instead.' : e && e.code === 'rate_limited' ? 'Claude usage limit reached. Try again later.' : 'AI triage failed. Basic rules are used for now.';
    if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) G.sample = null;
  }
  G.tri.busy = false; renderInbox(); flagTab();
}

async function aiWeek() {

function holdify(el, ms, onDone) {
  if (!el) return;
  let raf = 0, t0 = 0, done = false;
  const set = p => el.style.setProperty('--p', p);
  const start = e => { if (done) return; if (e && e.cancelable) e.preventDefault(); S.holding = true; el.classList.add('holding'); t0 = performance.now();
    const step = () => { const p = Math.min(1, (performance.now() - t0) / ms); set(p); if (p >= 1) { done = true; S.holding = false; el.classList.remove('holding'); el.classList.add('done'); try { navigator.vibrate && navigator.vibrate(18); } catch (x) { } if (onDone() === false) { done = false; el.classList.remove('done'); set(0); } return; } raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step); };
  const stop = () => { if (done) return; cancelAnimationFrame(raf); S.holding = false; el.classList.remove('holding'); set(0); };
  el.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => el.addEventListener(n, stop));
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); start(); } });
  el.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') stop(); });
}

async function decryptFeed(file, pass) {

    else { if (t.due && ex.due !== t.due) { ex.due = t.due; ch = true; } if (t.cls && ex.cls !== t.cls) { ex.cls = t.cls; ch = true; } }

async function loadFeed(force) {

  if (!F.data) { try { const c = JSON.parse(localStorage.getItem('lifeos.feed') || 'null'); if (c) { F.data = await decryptFeed(c, key); mergeFeedTasks(); } } catch (e) { } }
  if (!force && Date.now() - F.fetchedAt < 5 * 60e3) { renderInbox(); renderNow(); flagFeedTab(); return; }
  if (F.busy) return;
  F.busy = true; renderInbox();
  try {
    const file = await fetchFeedFile();
    if (!file) F.err = 'none';
    else {
      try { F.data = await decryptFeed(file, key); F.err = ''; try { localStorage.setItem('lifeos.feed', JSON.stringify(file)); } catch (e) { } mergeFeedTasks(); }
      catch (e) { F.err = 'badkey'; }
    }

async function unlock(val) {

    const file = await fetchFeedFile();
    if (!file) { setKey(key); F.err = 'none'; renderInbox(); return; }
    const data = await decryptFeed(file, key);
    setKey(key); F.data = data; F.err = ''; F.fetchedAt = Date.now();

}

    h += `<section class="block"><div class="label">Inbox</div><h2 style="font-size:26px;margin-top:12px">Unlock your inbox</h2>
      <p class="dim" style="margin:4px 0 0">Claude checks your Gmail every 2 hours (06–22), sorts it, and sends it here locked. Enter the passcode Claude gave you. You only do this once.</p></section>
      <form class="block" id="key-form" autocomplete="off"><label class="label" for="key-in">Passcode</label><input type="text" id="key-in" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX"><button class="btn solid" type="submit" style="height:50px">Unlock</button><div class="err" id="key-err" role="alert"></div></form>`;
  } else {
    const d = F.data, dis = dismissed();
    const sub = d ? `Updated ${ago(Date.parse(d.updated))} · Claude checks every 2 h, 06–22` : F.busy ? 'Loading…' : '';
    h += `<section class="ih"><div><div class="label">Gmail · last 31 days</div><div class="dim small" style="margin-top:4px">${esc(sub)}</div></div><button class="btn" id="f-refresh" ${F.busy ? 'disabled' : ''}>${F.busy ? 'Loading' : 'Refresh'}</button></section>`;
    if (F.err === 'badkey') h += `<div class="card"><div class="label">Passcode doesn't match</div><p class="dim small" style="margin:8px 0 12px">The inbox was locked with a different passcode.</p><button class="btn" id="f-rekey">Enter passcode again</button></div>`;
    else if (F.err === 'none') h += `<p class="note">No inbox yet. The first sync arrives within 2 hours.</p>`;
    else if (F.err === 'offline') h += `<p class="note">Offline. Showing the last update.</p>`;
    else if (F.err === 'offline-empty') h += `<div class="card"><div class="label">Can't reach the inbox</div><p class="dim small" style="margin:8px 0 0">Check your connection, then tap Refresh.</p></div>`;
    if (d) {
      const all = d.items || [];
      h += `<div class="chips" role="toolbar" aria-label="Filters">${FILTERS.map(f => { const n = all.filter(x => f[2](x, dis)).length; return `<button data-flt="${f[0]}" aria-pressed="${f[0] === flt[0]}">${esc(f[1])}<span class="n">${n}</span></button>`; }).join('')}</div>`;
      let list = all.filter(x => flt[2](x, dis));
      list.sort(flt[0] === 'imp' ? (a, b) => (ORDER[a.cat] ?? 9) - (ORDER[b.cat] ?? 9) || String(b.date).localeCompare(String(a.date)) : (a, b) => String(b.date || b.seen).localeCompare(String(a.date || a.seen)));
      const shown = list.slice(0, showN);
      h += `<section class="block">${shown.length ? `<ul class="mail">${shown.map(x => feedRow(x, dis)).join('')}</ul>` : `<p class="empty">${flt[0] === 'imp' ? 'Nothing needs you right now.' : 'No emails here in the last 31 days.'}</p>`}
        ${list.length > showN ? `<button class="btn" id="f-more">Show ${Math.min(40, list.length - showN)} more of ${list.length - showN}</button>` : ''}</section>`;
    }
  }
  const clsF = CLS[curFilter] ? curFilter : null;
  const items = (S.tasks.items || []).filter(i => !clsF || i.cls === clsF).slice().sort((a, b) => (a.done - b.done) || String(a.due || '9999').localeCompare(String(b.due || '9999')));
  const recent = items.filter(i => !i.done || !i.doneAt || (Date.now() - i.doneAt) < 3 * 864e5);
  h += `<section class="block"><div class="block-h"><span class="label">Assignments & deadlines${clsF ? ' · ' + esc(CLS[clsF]) : ''}</span><span class="label num">${items.filter(i => !i.done).length} open</span></div>
    ${recent.length ? `<ul class="tasks">${recent.map(taskRow).join('')}</ul>` : '<p class="empty">No open assignments.</p>'}
    <form class="addtask" id="addtask"><input type="text" id="nt-t" placeholder="Add an assignment" aria-label="Assignment title" maxlength="120"><input type="date" id="nt-d" aria-label="Due date"><button class="btn" type="submit">Add</button></form></section>`;
  h += `<p class="note">Assignments found in email are added automatically. School mail (Toddle, teachers) shows up once your Graded account forwards to this Gmail.</p>`;
  paint('#p-inbox', h);
  const kf = $('#key-form'); if (kf) kf.onsubmit = e => { e.preventDefault(); unlock($('#key-in').value); };
  const fr = $('#f-refresh'); if (fr) fr.onclick = () => loadFeed(true);
  const fm = $('#f-more'); if (fm) fm.onclick = () => { showN += 40; renderInbox(); };
  const rk = $('#f-rekey'); if (rk) rk.onclick = () => { setKey(''); F.err = ''; F.data = null; renderInbox(); renderNow(); };
  $$('[data-flt]').forEach(b => b.onclick = () => { curFilter = b.dataset.flt; showN = 40; try { localStorage.setItem('lifeos.filter', curFilter); } catch (e) { } renderInbox(); });
  $$('[data-dis]').forEach(b => b.onclick = () => { const cur = clone(Store.docs.inboxlocal) || {}; cur.dismissed = { ...(cur.dismissed || {}) }; const id = b.dataset.dis; if (cur.dismissed[id]) delete cur.dismissed[id]; else cur.dismissed[id] = Date.now(); const ids = Object.keys(cur.dismissed); if (ids.length > 400) ids.slice(0, ids.length - 400).forEach(k => delete cur.dismissed[k]); Store.put('inboxlocal', cur); flagFeedTab(); });
}
function todayBlock() {
  const dis = dismissed(); const n = F.data ? (F.data.items || []).filter(i => i.imp && !dis[i.id]).length : 0;
  const t = todayKey(), tm = addDays(t, 1);
  const open = (S.tasks.items || []).filter(i => !i.done && i.due);
  const late = open.filter(i => i.due < t), dT = open.filter(i => i.due === t), dTm = open.filter(i => i.due === tm);
  if (!n && !late.length && !dT.length && !dTm.length) return '';
  const names = a => esc(a.map(x => x.t).join(' · '));
  return `<button class="today" data-go="1"><span class="label">Today</span><span class="today-l">${n ? `<span><b>${n}</b> email${n > 1 ? 's' : ''} need${n > 1 ? '' : 's'} you</span>` : ''}${late.length ? `<span class="bad">Overdue: ${names(late)}</span>` : ''}${dT.length ? `<span>Due today: ${names(dT)}</span>` : ''}${dTm.length ? `<span class="dim">Due tomorrow: ${names(dTm)}</span>` : ''}</span></button>`;
}
async function exportBackup() {
  const body = JSON.stringify({ app: 'lifeos', v: 1, exported: new Date().toISOString(), docs: Store.docs });
  const name = `lifeos-backup-${todayKey()}.json`;
  const file = new File([body], name, { type: 'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'LIFEOS backup' }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function pickBackup() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    let data; try { data = JSON.parse(await f.text()); } catch (e) { toast("That file isn't a LIFEOS backup."); return; }
    if (!data || data.app !== 'lifeos' || !data.docs || !data.docs.settings) { toast("That file isn't a LIFEOS backup."); return; }
    const box = $('#imp-confirm'); if (!box) return;
    const n = Object.keys(data.docs).filter(k => k.startsWith('d-')).length;
    box.innerHTML = `<div class="card"><p style="margin:0 0 12px">Replace everything on this iPhone with the backup from ${esc(String(data.exported).slice(0, 10))} (${n} days)?</p><div class="btn-row"><button class="btn solid" id="imp-yes">Replace</button><button class="btn" id="imp-no">Cancel</button></div></div>`;
    $('#imp-no').onclick = () => { box.innerHTML = ''; };
    $('#imp-yes').onclick = () => { Store.docs = data.docs; writeLocal(Store.docs); closeSheet(); sheetMode = null; onData(); toast('Backup restored.'); };
  };
  inp.click();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadFeed(); });

/* ================= boot ================= */
(function boot() {
  const d = new Date();
  $('#sp-word').innerHTML = [...'LIFE'].map((c, i) => `<span style="animation-delay:${1.0 + i * .06}s;font-weight:600">${c}</span>`).join('') + [...'OS'].map((c, i) => `<span style="animation-delay:${1.24 + i * .06}s;font-weight:300">${c}</span>`).join('');
  $('#sp-date').textContent = `${DOW[d.getDay()]} ${pad(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()} · DAY ${pad(doy(d) + 1)}`;
  const sp = $('#splash');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hide = () => { if (sp.classList.contains('out')) return; sp.classList.add('out'); document.body.classList.add('boot'); setTimeout(() => { sp.remove(); document.body.classList.remove('boot'); }, 1300); };
  document.body.classList.remove('boot');
  sp.addEventListener('click', hide);
  setTimeout(hide, reduce ? 500 : 2200);
  const i = NAMES.indexOf(location.hash.slice(1)); if (i > 0) requestAnimationFrame(() => go(i, true));
  renderAll();
  Store.init();
  setTimeout(() => loadFeed(), 0);
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
})();
</script>
